name: Astronomica v14 Windows playability build
on:
  push:
    branches:
      - dev/completion-route-audit-20261021
  workflow_dispatch:
# Superseded commits should not consume Windows runners or publish stale previews.
concurrency:
  group: astronomica-v14-completion-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
      - name: Verify v14 export and regression tests
        shell: msys2 {0}
        run: |
          python tools/verify_export.py
          python -m unittest discover -s tests -v
      - name: Install pinned ScummVM and v14 engine
        shell: msys2 {0}
        run: python tools/prepare_scummvm.py
      - name: Compile and register Astronomica
        shell: msys2 {0}
        run: |
          cd work/fresh-20260913/scummvm
          ./configure --disable-all-engines --enable-engine=astronomica
          make -j2
          ./scummvm.exe --list-engines | grep -i astronomica
      - name: Package portable preview without original game data
        shell: msys2 {0}
        run: |
          mkdir -p dist/outputs/astronomica-cleanroom dist/tools
          cp work/fresh-20260913/scummvm/scummvm.exe dist/
          cp Avvia-Astronomica.cmd VERIFICA.cmd dist/
          cp outputs/astronomica-cleanroom/astronomica-play.ini dist/outputs/astronomica-cleanroom/
          cp outputs/astronomica-cleanroom/astro_reader.py outputs/astronomica-cleanroom/opcode-layout.json dist/outputs/astronomica-cleanroom/
          cp tools/game_archive.py tools/completion_audit.py tools/verify_gameplay.py dist/tools/
          printf '@echo off\r\nset "ASTRO_SCUMMVM=%%~dp0scummvm.exe"\r\ncall "%%~dp0Avvia-Astronomica.cmd"\r\n' > dist/GIOCA.cmd
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          import re, shutil, subprocess
          dest = Path("dist")
          queue = deque([dest / "scummvm.exe"])
          seen = set()
          compiler_bin = Path(shutil.which("g++")).parent
          while queue:
              executable = queue.popleft()
              result = subprocess.run(["objdump", "-p", str(executable)], capture_output=True, text=True, check=True)
              for name in re.findall(r"DLL Name:\s*([^\r\n]+)", result.stdout, re.I):
                  source = compiler_bin / name.strip()
                  key = name.casefold()
                  if source.is_file() and key not in seen:
                      seen.add(key)
                      target = dest / source.name
                      shutil.copy2(source, target)
                      queue.append(target)
          print("Bundled DLLs:", sorted(seen))
          PY
          ./dist/scummvm.exe --list-engines | grep -i astronomica
      - name: Publish v14 preview on GitHub Releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "astronomica-v14-completion-preview"
          $archive = "Astronomica-v14-Windows-x64-preview.zip"
          Compress-Archive -Path dist\* -DestinationPath $archive -Force
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Astronomica v14 - Windows Completion Preview" --notes "Experimental v14 build from dev/completion-route-audit-20261021 with English CD recognition and latest puzzle saves. Original game files not included. Run game_archive.py, then GIOCA.cmd. End-to-end manual completion NOT YET verified." --prerelease
          } else {
            gh release upload $tag $archive --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication denied" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets
