name: Astronomica Windows experimental build
on:
  push:
    branches:
      - fix/english-archive-playability
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mingw64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
      - name: Install pinned ScummVM and engine
        shell: msys2 {0}
        run: |
          python tools/verify_export.py
          python tools/prepare_scummvm.py
      - name: Compile experimental Astronomica engine
        shell: msys2 {0}
        run: |
          cd work/fresh-20260913/scummvm
          ./configure --disable-all-engines --enable-engine=astronomica
          make -j2
          ./scummvm.exe --list-engines | grep -i astronomica
      - name: Package portable Windows player without game data
        shell: msys2 {0}
        run: |
          mkdir -p dist/outputs/astronomica-cleanroom dist/tools
          cp work/fresh-20260913/scummvm/scummvm.exe dist/
          cp Avvia-Astronomica.cmd GIOCA-ASTRONOMICA.md dist/
          cp outputs/astronomica-cleanroom/astronomica-play.ini dist/outputs/astronomica-cleanroom/
          cp tools/game_archive.py dist/tools/
          printf '@echo off\r\nset "ASTRO_SCUMMVM=%%~dp0scummvm.exe"\r\ncall "%%~dp0Avvia-Astronomica.cmd"\r\n' > dist/GIOCA.cmd
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          import re, shutil, subprocess
          dest = Path("dist")
          queue = deque([dest / "scummvm.exe"])
          seen = set()
          while queue:
              executable = queue.popleft()
              result = subprocess.run(["objdump", "-p", str(executable)], capture_output=True, text=True, check=True)
              for name in re.findall(r"DLL Name:\s*([^\r\n]+)", result.stdout, re.I):
                  source = Path(shutil.which("g++")).parent / name.strip()
                  key = name.casefold()
                  if source.is_file() and key not in seen:
                      seen.add(key)
                      target = dest / source.name
                      shutil.copy2(source, target)
                      queue.append(target)
          print("Bundled DLLs:", sorted(seen))
          PY
          ./dist/scummvm.exe --list-engines | grep -i astronomica
      - name: Attempt GitHub Releases publication (may require repository permission)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "astronomica-windows-preview"
          $archive = "Astronomica-Windows-x64-preview.zip"
          Compress-Archive -Path dist\* -DestinationPath $archive -Force
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $archive --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Astronomica for ScummVM - Windows Preview" --notes "Experimental native ScummVM engine for the original Astronomica English edition. Original game data not included. Unpack, extract your original archive with tools/game_archive.py, then run GIOCA.cmd. Not yet validated by a complete manual playthrough." --prerelease
          } else {
            gh release upload $tag $archive --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Releases upload failed" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets
